name: Build Profile Assets

on:
  schedule:
    - cron: "0 1 * * *"        # 每天 UTC 01:00（北京时间 09:00）刷新
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare output dir
        run: mkdir -p _site/snake

      - name: Generate Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            _site/snake/github-snake.svg?color_snake=#3b5bdb&color_dots=#dfe3ec,#c2c9e0,#9aa6cf,#6c7fc0,#3d4670
            _site/snake/github-snake-dark.svg?color_snake=#bb9af7&color_dots=#16161e,#282c42,#3b4a7a,#5f7bd0,#9ece6a

      - name: Summary Cards (dark · tokyonight)
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          UTC_OFFSET: 8
          THEME: "tokyonight"
          AUTO_PUSH: false

      - name: Preserve dark output
        run: |
          mv profile-summary-card-output _site/profile-summary-card-output

      - name: Summary Cards (light · nord_bright)
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          UTC_OFFSET: 8
          THEME: "nord_bright"
          AUTO_PUSH: false

      - name: Assemble site
        run: |
          mv profile-summary-card-output/nord_bright _site/profile-summary-card-output/
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
